<title id="fig-6-2-title">CQRS fed by an event log</title>
<desc id="fig-6-2-desc">Commands reach the write model, the EventSeating aggregate, which appends events to an event store that is read as a stream; three projections (the seat-map view, the sales dashboard and the fan&#x27;s tickets) are built from that stream and answer queries.</desc>
