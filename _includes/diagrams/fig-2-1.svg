<div class="dg-figure" data-fig="fig-2-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 532" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-2-1-title fig-2-1-desc">
<title id="fig-2-1-title">The style catalog on two axes</title>
<desc id="fig-2-1-desc">Quadrant chart placing eight architecture styles by code partitioning, technical to domain, and deployment, monolithic to distributed: layered, microkernel and pipeline are classic monoliths; modular monolith is a domain-partitioned monolith; service-based, microservices and space-based are domain-partitioned and distributed; event-driven sits on the dividing line; and the technical-plus-distributed quadrant is empty.</desc>
