<div class="dg-figure" data-fig="fig-6-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 572" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-6-3-title fig-6-3-desc">
<title id="fig-6-3-title">Encore&#x27;s refund process as an explicit model</title>
<desc id="fig-6-3-desc">A refund request is approved automatically under 80 euros and more than 48 hours before the show, otherwise it goes to a human review; approval revokes the ticket, then the PSP refund retries until it succeeds or goes to manual resolution, and the seat is re-listed only if the show is more than 48 hours away.</desc>
