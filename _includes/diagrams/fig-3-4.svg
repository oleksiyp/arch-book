<title id="fig-3-4-title">The strangler fig</title>
<desc id="fig-3-4-desc">Users reach the system through a routing facade, which sends the extracted capability to the new Admission service and everything else to the legacy monolith, while the new service reads and writes legacy data through an anticorruption layer.</desc>
