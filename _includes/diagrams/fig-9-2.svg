<div class="dg-figure" data-fig="fig-9-2" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 388" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-9-2-title fig-9-2-desc">
<title id="fig-9-2-title">Anatomy of a data product</title>
<desc id="fig-9-2-desc">Operational events feed the transformation code of the ticket-sales data product, owned by the Orders team, which publishes a stream port of sales events and a table port of daily aggregates alongside its contract, SLOs, lineage and docs; dashboards and data science subscribe to the stream, revenue reporting to the table.</desc>
