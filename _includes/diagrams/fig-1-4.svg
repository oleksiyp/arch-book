<div class="dg-figure" data-fig="fig-1-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 284" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-1-4-title fig-1-4-desc">
<title id="fig-1-4-title">An ADR&#x27;s life</title>
<desc id="fig-1-4-desc">An architecture decision record is written and proposed for review; the team either accepts it, and a later ADR may supersede it, or rejects it with reasons, and the rejected record is kept because it saves the next person from re-arguing the question.</desc>
