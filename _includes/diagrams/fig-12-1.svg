<div class="dg-figure" data-fig="fig-12-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 284" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-12-1-title fig-12-1-desc">
<title id="fig-12-1-title">The RAG pipeline</title>
<desc id="fig-12-1-desc">Data products are chunked, embedded and stored in a hybrid vector and keyword index; a fan&#x27;s question is rewritten with the fan&#x27;s context and searched against that index filtered by the fan&#x27;s permissions, and a reranker passes the best three to five of the top-k candidates to the model, which answers with citations.</desc>
