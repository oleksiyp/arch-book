<title id="fig-14-1-title">The two planes of a SaaS platform</title>
<desc id="fig-14-1-desc">The control plane manages tenants through onboarding, tenant identity, config and tiering, billing and metering, and tenant-aware ops; it provisions, configures and observes the application plane, which serves the venue-chain tenant, the festival tenant and 500 self-service venues.</desc>
