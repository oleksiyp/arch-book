<div class="dg-figure"><svg class="dg" viewBox="0 0 864 368" style="min-width:864px" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-7-2-title fig-7-2-desc">
<title id="fig-7-2-title">Edge vs. interior: gateway and mesh</title>
<desc id="fig-7-2-desc">Partners and apps reach the API gateway at the edge, which handles authentication, quotas, rate limits and canary routing and forwards into the interior; there the BFFs and public API services call Inventory and Orders east–west, inside the service mesh with mTLS, retries and telemetry.</desc>
