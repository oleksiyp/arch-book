<div class="dg-figure" data-fig="fig-13-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 172" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-13-1-title fig-13-1-desc">
<title id="fig-13-1-title">The evolution road and the posture per stage</title>
<desc id="fig-13-1-desc">Every capability moves from genesis, where you build because nobody sells it, to custom, where you build or adopt if it differentiates, to product, where you buy and let vendors compete, to commodity, where you rent, pay per unit and forget.</desc>
