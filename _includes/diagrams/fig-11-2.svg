<div class="dg-figure"><svg class="dg" viewBox="0 0 864 356" style="min-width:864px" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-11-2-title fig-11-2-desc">
<title id="fig-11-2-title">The error budget as automatic policy</title>
<desc id="fig-11-2-desc">The remaining error budget decides the release posture: with budget left, ship features as canaries promote and flags open; when it is burning fast, slow down as canaries hold and risky flags freeze; when it is exhausted, do reliability work only until the budget recovers.</desc>
