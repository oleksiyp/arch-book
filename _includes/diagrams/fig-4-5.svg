<text class="dg-name" x="160" y="90">Closed</text>
<text class="dg-sub" x="160" y="104">calls flow</text>
<rect class="dg-mask" x="528" y="64" width="160" height="56" rx="8"/>
<rect class="dg-n dg-n-focal" x="528" y="64" width="160" height="56" rx="8"/>
<text class="dg-name" x="608" y="90">Open</text>
<text class="dg-sub" x="608" y="104">fail fast</text>
<rect class="dg-mask" x="304" y="208" width="160" height="56" rx="8"/>
<rect class="dg-n dg-n-backend" x="304" y="208" width="160" height="56" rx="8"/>
<text class="dg-name" x="384" y="234">Half-open</text>
