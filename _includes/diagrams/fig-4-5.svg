<div class="dg-figure"><svg class="dg" viewBox="0 0 864 344" style="min-width:864px" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-4-5-title fig-4-5-desc">
<title id="fig-4-5-title">The circuit breaker&#x27;s three states</title>
<desc id="fig-4-5-desc">A circuit breaker starts Closed and trips to Open when failures exceed a threshold; while Open, calls fail instantly so no threads are parked and the dependency gets air; after a cool-down it goes Half-open, where a probe that succeeds closes it and a probe that fails opens it again.</desc>
