<rect class="dg-mask" x="480" y="166" width="104" height="12" rx="2"/><text class="dg-label" x="532" y="175">COOL-DOWN ELAPSES</text>
<rect class="dg-mask" x="648" y="178" width="72" height="12" rx="2"/><text class="dg-label" x="684" y="187">PROBE FAILS</text>
<rect class="dg-mask" x="188" y="216" width="88" height="12" rx="2"/><text class="dg-label" x="232" y="225">PROBE SUCCEEDS</text>
