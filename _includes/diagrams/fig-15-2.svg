<title id="fig-15-2-title">The platform as the book&#x27;s index page</title>
<desc id="fig-15-2-desc">Forty product teams use golden paths and a self-service portal on a platform control plane for provisioning, registry, scorecards and metering, which manages the capabilities built in earlier chapters: compute and delivery, the event backbone, data products, API and UI paths, security guardrails and the AI gateway.</desc>
