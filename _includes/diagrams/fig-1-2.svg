<title id="fig-1-2-title">Encore&#x27;s system context</title>
<desc id="fig-1-2-desc">Fans browse, queue and buy, and organizers manage events, all through Encore, a single system whose insides are not yet decided; Encore charges cards through a payment provider and issues tickets to mobile wallets.</desc>
