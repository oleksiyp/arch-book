<div class="dg-figure" data-fig="fig-3-2" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 468" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-3-2-title fig-3-2-desc">
<title id="fig-3-2-title">Encore&#x27;s context map</title>
<desc id="fig-3-2-desc">Three core contexts, On-Sale Admission, Seat Inventory and Ticketing, and Orders and Payments, are partners; Event Catalog supplies On-Sale Admission as customer and supplier; Seat Inventory publishes ticket events to Support and Refunds as an open-host service; and the external payment provider reaches Orders and Payments only through an anticorruption layer.</desc>
