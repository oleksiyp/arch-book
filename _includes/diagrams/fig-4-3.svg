<div class="dg-figure" data-fig="fig-4-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-4-3-title fig-4-3-desc">
<title id="fig-4-3-title">The workhorse topology</title>
<desc id="fig-4-3-desc">Clients reach a load balancer that spreads requests over stateless service instances, more of which are added on demand; the instances use a distributed cache and a primary store, and hand slow or asynchronous work to a queue drained by workers that scale independently.</desc>
