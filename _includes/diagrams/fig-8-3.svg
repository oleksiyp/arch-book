<title id="fig-8-3-title">BFFs per experience</title>
<desc id="fig-8-3-desc">The fan app calls its own Fan BFF, owned by the fan-web team, which fans out to Catalog, Inventory and Orders; the organizer web app calls the Organizer BFF, which uses Catalog and Analytics; Inventory&#x27;s seat events reach the fan app through a realtime SSE edge.</desc>
